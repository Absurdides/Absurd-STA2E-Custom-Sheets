<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STA 2E Campaign Roster &amp; Bridge Duty</title>
<link rel="stylesheet" href="fonts.css?v=1.0">
<link rel="icon" type="image/png" href="icon-ent.png">
<meta name="theme-color" content="#2c3a4d">
<style>
:root{--navy:#2c3a4d;--orange:#d96b27;--tan:#eed292;--slate:#708699;--bg:#e9edf1;--page:#fff;--fg:#111;--line:#111;--card:#f5f7fa;--bd:#c0c8cf;--hd:#2c3a4d;--foc:#46586b}
body.dark{--bg:#0b1118;--page:#18222f;--fg:#e8ecf0;--line:#cfd6dd;--card:#222e3d;--bd:#3a4a5c;--hd:#eed292;--foc:#b4c0cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 'Roboto',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:1000px;margin:0 auto;padding:10px 12px}
.btn{font:bold 11px 'Antonio','Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--navy);border:0;border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{opacity:.85}.btn.s{background:var(--slate)}.btn.o{background:var(--orange)}.btn.r{background:#bd4b4b}.btn.on{background:var(--tan);color:#000}
.sp{flex:1}
.sheet{max-width:1000px;margin:0 auto 40px;background:var(--page);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:0 18px 20px;overflow:hidden}
.cap{display:flex;height:30px;gap:4px;margin:0 -18px 12px}.cap i{display:block}.c1{width:40px;background:var(--orange);border-bottom-right-radius:12px}.c2{flex:1;background:var(--navy);color:#fff;font:bold 13px/30px 'Antonio','Oswald',sans-serif;letter-spacing:2px;text-transform:uppercase;padding-left:14px;white-space:nowrap;overflow:hidden}.c3{width:36px;background:var(--tan)}
h1{font-family:'Antonio','Oswald',sans-serif;text-transform:uppercase;color:var(--hd);font-size:24px;letter-spacing:1.5px;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.cards{display:grid;grid-template-columns:1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;gap:3px}
.card b{font-family:'Antonio','Oswald',sans-serif;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.card small,.muted{color:var(--slate)}
.badge{float:right;background:var(--orange);color:#fff;border-radius:3px;padding:0 6px;font:bold 11px 'Antonio',sans-serif}
.st{font:bold 10.5px 'Antonio','Oswald',sans-serif;letter-spacing:.5px}
.card input,.modal input{font:12px 'Roboto',Arial,sans-serif;background:var(--page);color:var(--fg);border:1px solid var(--bd);border-radius:3px;padding:2px 5px;width:100%}
.cb{display:flex;gap:5px;margin-top:3px}.cb .btn{padding:3px 8px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;row-gap:4px;align-items:start}
.card .cl{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .cr{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;gap:2px}
.card .sg{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.card b{line-height:22px}
.card .stl{display:flex;align-items:center;min-height:22px;font:bold 14px/22px 'Antonio',sans-serif;letter-spacing:1px;text-transform:uppercase}
.card .stt{height:22px;line-height:20px;padding:0 17px 0 14px;border-radius:11px 0 0 11px;color:#fff;letter-spacing:1px}
.card .dot{flex:none;width:22px;height:22px;font:bold 12px/16px 'Antonio',sans-serif;margin:0 0 0 -11px}
.card .l1{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;column-gap:12px}
.card .sub{font-size:12px;color:var(--foc);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card .cf{font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden;color:var(--fg);font-style:italic}
.card .g{margin-left:0}
.card .cbr{display:flex;gap:8px;align-items:center;margin-top:2px}
.card .cbr input{width:150px;text-align:left}
@media(max-width:620px){.card{grid-template-columns:1fr}.card .cr,.card .sg{align-items:flex-start}}
.el,.es1{display:flex;flex-direction:column;gap:2px;font:bold 10px 'Antonio',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--tan)}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.w2{grid-column:1/-1}
.esg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.esg input{text-align:center}
.modal textarea{width:100%;font:12px 'Roboto',Arial,sans-serif;background:var(--page);color:var(--fg);border:1px solid var(--bd);border-radius:3px;padding:4px 6px;resize:vertical}
.map img{display:block;width:100%;height:auto}
.map .mc,.map .ml{display:none}.map.col .mc{display:block}.map:not(.col) .ml{display:block}.map.badc .mc{display:none!important}.map.badc .ml{display:block}
body.dark .map .ml{filter:invert(1) brightness(.85)}
.map.col .pin{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff)}
.bw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.map{position:sticky;top:8px;width:min(100%,360px);flex:0 0 auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font:bold 12px 'Antonio',sans-serif;padding:0;cursor:pointer;color:#fff;line-height:1;z-index:2}
.pin.e,.dot.e{background:var(--page);color:var(--fg);border-style:dotted}
.pin.ed{cursor:grab;touch-action:none;box-shadow:0 0 0 3px rgba(217,107,39,.5)}
.row{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);background:var(--card);border-radius:5px;padding:4px 8px;cursor:pointer}
.dot{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);color:#fff;font:bold 13px/24px 'Antonio',sans-serif;text-align:center;font-style:normal;margin-top:2px}
.rb{flex:1;min-width:0}
.row{min-width:0}
.l1,.l2{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:space-between;align-items:flex-end}
.row b{font:bold 14px 'Antonio',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--slate)}
.row .who{font:bold 14px 'Roboto',Arial,sans-serif}
.xs{padding:2px 8px;align-self:center}
.l3{font-size:12px;color:var(--foc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small.f{color:var(--foc)}
.g{display:grid;grid-template-columns:repeat(6,20px) 9px repeat(6,20px);text-align:center;font:bold 12px 'Antonio',sans-serif;margin-left:auto}
.g i{display:block;justify-self:center;width:1px;background:var(--bd)}
.g.lg{font-size:9.5px;letter-spacing:.3px}
.g.lg span{height:13px;line-height:11px;margin:0 1px;border-radius:3px}
.slist{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--navy);color:#fff;border:2px solid var(--tan);border-radius:6px;padding:10px 12px;width:500px;max-width:96vw;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.dh{font:900 14px 'Antonio',sans-serif;letter-spacing:1px;color:var(--tan);border-bottom:1px solid var(--slate);padding-bottom:4px;display:flex;justify-content:space-between}
.dh button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.sec{font:bold 11px 'Antonio',sans-serif;letter-spacing:1px;color:var(--tan);text-transform:uppercase;margin-top:4px}
.sum{background:rgba(255,255,255,.08);border-radius:4px;padding:5px 8px}
.pick{display:block;width:100%;text-align:left;background:#3a4a5f;color:#fff;border:0;border-radius:3px;padding:5px 8px;margin-bottom:3px;cursor:pointer;font:12px 'Roboto',Arial,sans-serif}
.pick:hover{background:var(--orange)}
.modal .btn{margin-top:2px}
@media print{.map .mc{display:none!important}.map .ml{display:block!important;filter:none!important}.map.nol .mc{display:block!important}.map.nol .ml{display:none!important}.map .pin{filter:none}body,body.dark{--page:#fff;--fg:#111;--line:#000;--card:#fff;--bd:#999;--hd:#2c3a4d;--foc:#333;background:#fff}.bar,.ov,.cb,#btools,.pin{display:none!important}.pin.p{display:block!important}.sheet{box-shadow:none;max-width:none}}
</style>
</head>
<body>
<div class="bar"><a class="btn" id="back" href="index.html" title="Back to the console">&larr; Console</a>
<button type="button" class="btn on" data-tab="roster">Roster</button><button type="button" class="btn s" data-tab="bridge">Bridge</button><span class="sp"></span>
<button type="button" class="btn o" id="imp">Import Character</button><button type="button" class="btn s" id="loc" title="Read crew slots saved in this browser by the console">From This Browser</button><button type="button" class="btn o" id="exp">Export Roster</button><button type="button" class="btn s" id="expimp">Import Roster</button><button type="button" class="btn s" id="theme">Theme</button><button type="button" class="btn s" onclick="print()">Print</button>
<input type="file" id="f1" accept=".json" multiple hidden><input type="file" id="f2" accept=".json" hidden></div>
<main class="sheet">
<div class="cap"><i class="c1"></i><i class="c2" id="barlbl">Campaign Roster // Personnel &amp; NPC Index</i><i class="c3"></i></div>
<h1 id="ttl">Campaign Roster</h1>
<section id="t-roster"><div class="chips" id="chips"></div><div class="cards" id="cards"></div></section>
<section id="t-bridge" hidden><div class="chips" id="btabs"></div><div class="chips" id="btools"></div><div class="bw"><div class="map col" id="map"><img class="mc" alt="" onerror="this.parentNode.classList.add('badc')"><img class="ml" alt=""><div id="pins"></div></div><div class="slist" id="slist"></div></div></section>
</main>
<div id="ovh"></div>
<script src="bridge/layouts.js"></script>
<script>
(function(){
var K='sta2e_campaign_roster',$=function(s){return document.querySelector(s)};
var R='#bd4b4b',G='#c49a45',B='#4b8bbd';
// [number, station, colour, x%, y%]  (positions read from the marked image; edit freely)
var CC={C:R,O:G,S:B};
var LAY=Array.isArray(window.STA_BRIDGES)&&window.STA_BRIDGES.length?window.STA_BRIDGES:[{id:'main',name:'Main Bridge',img:'bridge/main-bridge-colour.png',line:'bridge/main-bridge.svg',st:[[1,'Captain','C',50.6,45.9],[2,'First Officer','C',35,47.1],[3,'Counselor','S',65.3,46.9],[4,'Operations','O',56.9,54.1],[5,'Conn','C',44.4,54.1],[6,'Tactical','O',50.6,31.1],[7,'Tactical II','O',22.5,49.2],[8,'Science','S',12.1,54.2],[9,'Environment','O',11.3,48.6],[10,'Science II','S',12.9,42.9],[11,'Engineering','O',76.7,49.2],[12,'Engineering 2','O',87.2,53.9],[13,'Mission Ops','O',87.5,48.1],[14,'Science III','S',85.8,42.7]]}];
function lay(id){return LAY.filter(function(L){return L.id===id})[0]}
function defSt(L){return L?L.st.map(function(q){return {n:q[0],name:q[1],c:CC[q[2]]||G,x:q[3],y:q[4]}}):[]}
var SL=['CTL','FIT','DAR','INS','PRE','REA','CMD','CON','ENG','SEC','MED','SCI'];
var SK=['attr_control','attr_fitness','attr_daring','attr_insight','attr_presence','attr_reason','dept_command','dept_conn','dept_engineering','dept_security','dept_medicine','dept_science'];
var SC=['#708699','#708699','#708699','#708699','#708699','#708699',R,R,G,G,B,B];
var D={chars:[],bridges:[]},F='all',EDIT=false,MAPC=true;
try{MAPC=localStorage.getItem('sta2e_roster_map')!=='l'}catch(e){}
function applyMap(){var b=BR(),L=lay(b.id),m=$('#map');if(!m)return;var hc=!!(L&&L.img),hl=!!(L&&L.line),col=hc&&(MAPC||!hl);
 m.classList.toggle('col',col);m.classList.toggle('nol',!hl);m.classList.remove('badc');
 m.style.width='min(100%,'+((L&&L.w)||360)+'px)';
 [['.mc',hc?L.img:''],['.ml',hl?L.line:'']].forEach(function(p){var e=m.querySelector(p[0]);if(p[1]){if(e.getAttribute('src')!==p[1])e.setAttribute('src',p[1])}else e.removeAttribute('src')})}
function norm(d){var o={chars:d.chars||[],bridges:Array.isArray(d.bridges)?d.bridges:[],act:d.act};
 if(!o.bridges.length&&d.seats)o.bridges=[{id:'main',seats:d.seats}];
 o.bridges.forEach(function(b,i){if(!b.id)b.id=i?'b'+i:'main';b.seats=b.seats||{}});
 LAY.slice().reverse().forEach(function(L){var b=o.bridges.filter(function(x){return x.id===L.id})[0];if(!b){b={id:L.id,seats:{}};o.bridges.unshift(b)}b.builtin=true;b.name=L.name;if(!Array.isArray(b.st)||!b.st.length)b.st=defSt(L)});
 o.bridges.forEach(function(b){if(!b.name)b.name='Bridge';if(!Array.isArray(b.st))b.st=[];Object.keys(b.seats).forEach(function(k){if(!b.st.some(function(z){return z.n===+k}))delete b.seats[k]})});
 o.bridges=LAY.map(function(L){return o.bridges.filter(function(x){return x.id===L.id})[0]}).concat(o.bridges.filter(function(x){return !lay(x.id)}));
 if(!o.bridges.some(function(b){return b.id===o.act}))o.act=o.bridges[0].id;return o}
try{var d0=JSON.parse(localStorage.getItem(K));if(d0&&Array.isArray(d0.chars))D=norm(d0)}catch(e){}
if(!D.bridges.length)D=norm(D);
function BR(){return D.bridges.filter(function(b){return b.id===D.act})[0]||D.bridges[0]}
function sts(){return BR().st.slice().sort(function(a,b){return a.n-b.n})}
function stn(n){return BR().st.filter(function(q){return q.n===n})[0]}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Browser storage is full. Use Export Roster.')}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function byId(id){return D.chars.filter(function(c){return c.id===id})[0]}
function lab(c){return [c.rank,c.name].filter(Boolean).join(' ')||'Unnamed'}
function seatElse(id){for(var i=0;i<D.bridges.length;i++){var b=D.bridges[i];if(b.id===D.act)continue;for(var n in b.seats){var q=b.st.filter(function(z){return z.n===+n})[0];if(b.seats[n].id===id&&q)return b.name+': '+q.name}}return ''}
function seatOf(id){for(var n in BR().seats)if(BR().seats[n].id===id&&stn(+n))return +n;return 0}
function stats(c){if(!c.stats||!c.stats.some(Boolean))return '';return c.stats.map(function(v,i){return '<span style="color:'+SC[i]+'">'+SL[i]+' '+esc(v||'-')+'</span>'}).join(' ')}
function foc(c){return (c.foc||[]).filter(Boolean).map(function(f){return String(f).split(/\s+-\s+|:|\s*\(/)[0].trim()}).join(' \u00B7 ')}
function players(){var o={};D.chars.forEach(function(c){if(c.player)o[c.player]=1});return Object.keys(o).sort()}
function fromSheet(d){var g=function(k){return d[k]==null?'':String(d[k]).trim()};
 return {rank:g('bio_rank'),name:g('bio_name'),species:g('bio_species'),role:g('bio_assignment'),pron:g('bio_pronouns'),player:g('bio_player'),stats:SK.map(g),foc:[1,2,3,4,5,6].map(function(i){return g('ledger_focus_'+i)})}}
function addChars(list){var a=0,u=0;list.forEach(function(n){
 var ex=n.name&&D.chars.filter(function(c){return c.name.toLowerCase()===n.name.toLowerCase()})[0];
 if(ex){var pl=ex.player;Object.assign(ex,n);if(!n.player)ex.player=pl;u++}else{n.id=uid();D.chars.push(n);a++}});
 save();render();alert('Added '+a+', updated '+u+'.')}
function isSheet(d){return d&&typeof d==='object'&&(d._bundle==='sta2e-unified-v3'||d.bio_name!==undefined)}
function readFiles(inp,fn){Array.prototype.forEach.call(inp.files,function(f){var r=new FileReader();r.onload=function(e){var d;try{d=JSON.parse(e.target.result)}catch(x){alert(f.name+': not valid JSON.');return}fn(d,f.name)};r.readAsText(f)});inp.value=''}
$('#imp').onclick=function(){$('#f1').click()};
$('#f1').onchange=function(){readFiles(this,function(d,n){
 if(d&&d._bundle==='sta2e-backup-v1'&&d.characters&&d.characters.data){addChars(Object.keys(d.characters.data).map(function(k){return fromSheet(d.characters.data[k]||{})}).filter(function(c){return c.name}))}
 else if(isSheet(d)){var c=fromSheet(d);if(!c.name){alert(n+': character has no name.');return}addChars([c])}
 else alert(n+': not a console character or Backup All file.')})};
$('#loc').onclick=function(){var idx;try{idx=JSON.parse(localStorage.getItem('sta2e_storage_slots_index'))}catch(e){}
 if(!idx||!idx.length){alert('No console crew slots found in this browser. Use Import Character instead.');return}
 var l=[];idx.forEach(function(s){try{var c=fromSheet(JSON.parse(localStorage.getItem('sta2e_slot_data_'+s.id)));if(c.name)l.push(c)}catch(e){}});
 if(!l.length){alert('The saved slots have no named characters.');return}addChars(l)};
$('#exp').onclick=function(){var a=document.createElement('a');a.download='sta2e_roster_'+new Date().toLocaleDateString('en-CA')+'.json';a.href=URL.createObjectURL(new Blob([JSON.stringify({_bundle:'sta2e-roster-v1',chars:D.chars,bridges:D.bridges})],{type:'application/json'}));document.body.appendChild(a);a.click();a.remove()};
$('#expimp').onclick=function(){$('#f2').click()};
$('#f2').onchange=function(){readFiles(this,function(d){
 if(!d||d._bundle!=='sta2e-roster-v1'||!Array.isArray(d.chars)){alert('Not a roster file.');return}
 if(confirm('Replace the whole roster and bridge with this file?\nOK = replace. Cancel = add its characters only.')){D=norm(d);save();render()}else addChars(d.chars)})};
function render(){chips();cards();bridge()}
function chips(){var h='',p=players(),npc=D.chars.some(function(c){return !c.player});
 var b=function(v,t){return '<button type="button" class="btn '+(F===v?'on':'s')+'" data-f="'+esc(v)+'">'+esc(t)+'</button>'};
 h+=b('all','All ('+D.chars.length+')');p.forEach(function(x){h+=b(x,x)});if(npc)h+=b('__npc','NPC / GM');
 $('#chips').innerHTML=h+'<span class="sp"></span><button type="button" class="btn o" data-addnpc="1">+ NPC / Character</button>'}
function cards(){var l=D.chars.filter(function(c){return F==='all'||(F==='__npc'?!c.player:c.player===F)});
 $('#cards').innerHTML=l.length?l.map(function(c){var n=seatOf(c.id),q=n&&stn(n),se=!q&&seatElse(c.id),f=foc(c),hs=c.stats&&c.stats.some(Boolean),sub=[c.species,c.role,c.pron].filter(Boolean).join(' \u00B7 ');
  return '<div class="card"><div class="cl"><div class="l1"><b>'+esc(lab(c))+'</b><span class="sub">'+esc(sub)+'</span></div><div class="cf">'+esc(f)+'</div>'
  +'<div class="cbr"><div class="cb"><button type="button" class="btn s" data-ed="'+c.id+'">Edit</button><button type="button" class="btn r" data-rm="'+c.id+'">Remove</button></div>'
  +'<input data-pl="'+c.id+'" value="'+esc(c.player)+'" maxlength="20" placeholder="Player (blank = NPC / GM)"></div></div>'
  +'<div class="cr"><div class="stl">'+(q?'<span class="stt" style="background:'+q.c+';color:'+(q.c===G?'#000':'#fff')+'">'+esc(q.name)+'</span><i class="dot" style="background:'+q.c+'">'+q.n+'</i>':(se?'<span class="muted">'+esc(se)+'</span>':''))+'</div>'+(hs?'<div class="sg">'+grid(0,1)+grid(c.stats)+'</div>':'')+'</div></div>'}).join(''):'<p class="muted">No characters here yet. Use Import Character (a console Export Crew or Backup All file), From This Browser, or + NPC / Character.</p>';fitF()}
function occ(n){var s=BR().seats[n];if(!s)return null;if(s.id){var c=byId(s.id);return c?{t:lab(c),c:c}:null}return {t:s.text,c:null}}
function grid(a,leg){var h='<div class="g'+(leg?' lg':'')+'">';for(var i=0;i<12;i++){if(i===6)h+='<i></i>';h+=leg?'<span style="background:'+SC[i]+';color:'+(i===8||i===9?'#000':'#fff')+'">'+SL[i]+'</span>':'<span>'+esc((a&&a[i])||'-')+'</span>'}return h+'</div>'}
function bridge(){applyMap();barTxt();var st=sts();
 $('#btabs').innerHTML=D.bridges.length>1?D.bridges.map(function(b){return '<button type="button" class="btn '+(b.id===D.act?'on':'s')+'" data-bt="'+esc(b.id)+'">'+esc(b.name)+'</button>'}).join(''):'';
 $('#pins').innerHTML=st.map(function(q){var o=occ(q.n);return '<button type="button" class="pin '+(o?'p':'e')+(EDIT?' ed':'')+'" data-stn="'+q.n+'" title="'+esc(q.name+(o?': '+o.t:''))+'" style="left:'+q.x+'%;top:'+q.y+'%;'+(o?'background:'+q.c:'border-color:'+q.c)+'">'+q.n+'</button>'}).join('');
 $('#slist').innerHTML=st.map(function(q){var o=occ(q.n),c=o&&o.c,hs=c&&c.stats&&c.stats.some(Boolean),f=c?foc(c):'';
  return '<div class="row" data-stn="'+q.n+'"><i class="dot'+(o?'':' e')+'" style="'+(o?'background:'+q.c:'border-color:'+q.c)+'">'+q.n+'</i><div class="rb"><div class="l1"><b>'+esc(q.name)+'</b>'+(o?'':'<span class="muted">Unassigned</span>')+(hs?grid(0,1):'')+'</div>'+(o?'<div class="l2"><span class="who">'+esc(o.t)+'</span>'+(hs?grid(c.stats):'')+'</div>':'')+(f?'<div class="l3">'+esc(f)+'</div>':'')+'</div>'+(EDIT?'<button type="button" class="btn r xs" data-delst="'+q.n+'" title="Delete this station">&times;</button>':'')+'</div>'}).join('');
 var L0=lay(BR().id);$('#btools').innerHTML=(L0&&L0.img&&L0.line?'<button type="button" class="btn s" data-map="1">Map: '+(MAPC?'Colour':'Line Art')+'</button>':'')+'<button type="button" class="btn '+(EDIT?'on':'s')+'" data-edit="1">Edit Layout</button>'+(EDIT?'<button type="button" class="btn o" data-addst="1">+ Station</button><button type="button" class="btn r" data-rst="1">Reset Layout</button><button type="button" class="btn s" data-cpy="1">Copy Default Entry</button>'+(BR().builtin?'':'<button type="button" class="btn r" data-delbr="1">Delete Bridge</button>')+'<span class="muted">Drag pins to move. Tap a pin to rename, renumber or delete.</span>':'');fitF()}
function fitF(){document.querySelectorAll('.l3,.cf').forEach(function(e){if(!e.offsetParent)return;var two=e.classList.contains('cf'),z=two?13:12;e.style.fontSize=z+'px';while((two?e.scrollHeight>e.clientHeight+1:e.scrollWidth>e.clientWidth)&&z>7){z-=.5;e.style.fontSize=z+'px'}})}
window.addEventListener('resize',fitF);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitF);
function editStn(n){var q=stn(n);if(!q)return;var nn=prompt('Station number:',q.n);if(nn===null)return;nn=parseInt(nn,10);
 if(!nn||nn<1){alert('Number must be 1 or more.');return}
 if(nn!==q.n&&stn(nn)){alert('Station '+nn+' already exists.');return}
 var nm=prompt('Station name (clear it to delete this station):',q.name);if(nm===null)return;
 if(!nm.trim()){if(confirm('Delete station '+q.n+' '+q.name+'?')){delete BR().seats[q.n];BR().st=BR().st.filter(function(z){return z!==q});save();render()}return}
 var c=prompt('Department colour: C = Command (red), O = Operations (gold), S = Sciences (blue)',q.c===R?'C':(q.c===B?'S':'O'));if(c===null)return;
 c=c.trim().toUpperCase();q.c=c==='C'?R:(c==='S'?B:G);q.name=nm.trim();
 if(nn!==q.n){var z=BR().seats;if(z[q.n]){z[nn]=z[q.n];delete z[q.n]}q.n=nn}
 save();render()}
function addStn(){var nm=prompt('New station name:');if(!nm||!nm.trim())return;var c=prompt('Department colour: C = Command, O = Operations, S = Sciences','O');if(c===null)return;c=c.trim().toUpperCase();
 var n=Math.max.apply(null,BR().st.map(function(q){return q.n}).concat([0]))+1,k=BR().st.filter(function(q){return q.y<8&&q.x<40}).length;
 BR().st.push({n:n,name:nm.trim(),c:c==='C'?R:(c==='S'?B:G),x:3+k*6,y:3});save();render()}
var drag=null,moved=false;
document.addEventListener('pointerdown',function(e){var p=e.target.closest&&e.target.closest('.pin.ed');if(!p)return;drag={n:+p.dataset.stn,x:e.clientX,y:e.clientY,el:p};moved=false;try{p.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',function(e){if(!drag)return;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)moved=true;if(!moved)return;var r=$('#map').getBoundingClientRect(),q=stn(drag.n);q.x=Math.max(0,Math.min(100,+((e.clientX-r.left)/r.width*100).toFixed(1)));q.y=Math.max(0,Math.min(100,+((e.clientY-r.top)/r.height*100).toFixed(1)));drag.el.style.left=q.x+'%';drag.el.style.top=q.y+'%'});
document.addEventListener('pointerup',function(){if(!drag)return;var d=drag;drag=null;if(moved)save();else editStn(d.n)});
function modal(h){$('#ovh').innerHTML='<div class="ov" data-ov="1"><div class="modal">'+h+'</div></div>'}
function closeM(){$('#ovh').innerHTML=''}
function seat(n){var s=stn(n),cur=BR().seats[n],o=occ(n);
 var h='<div class="dh"><span>'+n+' '+esc(s.name.toUpperCase())+'</span><button type="button" data-x="1">&times;</button></div>';
 if(o){h+='<div class="sum"><b>'+esc(o.t)+'</b>'+(o.c?'<br><small>'+esc([o.c.species,o.c.role,o.c.player&&'Player: '+o.c.player].filter(Boolean).join(' \u00B7 '))+'</small><div class="st">'+stats(o.c)+'</div><small>'+esc(foc(o.c))+'</small>':' <small>(label only)</small>')+'</div><button type="button" class="btn r" data-clr="'+n+'">Clear Station</button>'}
 h+='<div class="sec">Assign from roster</div>';
 var gs=players().concat(['']);gs.forEach(function(p){var l=D.chars.filter(function(c){return c.player===p});if(!l.length)return;
  h+='<div class="muted">'+esc(p||'NPC / GM')+'</div>'+l.map(function(c){var k=seatOf(c.id);return '<button type="button" class="pick" data-pick="'+c.id+'">'+esc(lab(c))+(k?' <small>(now Stn '+k+')</small>':'')+'</button>'}).join('')});
 if(!D.chars.length)h+='<div class="muted">Roster is empty.</div>';
 h+='<div class="sec">Custom name</div><input id="cr" placeholder="Rank (optional)"><input id="cn" placeholder="Name"><div><button type="button" class="btn s" data-lab="'+n+'">Seat as Label</button> <button type="button" class="btn o" data-npc="'+n+'">Save as NPC and Seat</button></div>';
 modal(h)}
function edit(id){var c=(id&&byId(id))||{rank:'',name:'',species:'',role:'',pron:'',player:'',stats:[],foc:[]};
 var f=function(k,l,v,w){return '<label class="el'+(w?' w2':'')+'">'+l+'<input id="e-'+k+'" value="'+esc(v)+'"></label>'};
 var sg=SL.map(function(l,i){return '<label class="es1" style="color:'+SC[i]+'">'+l+'<input id="e-s'+i+'" maxlength="2" value="'+esc((c.stats||[])[i]||'')+'"></label>'}).join('');
 modal('<div class="dh"><span>'+(id?'EDIT CHARACTER':'NEW CHARACTER')+'</span><button type="button" data-x="1">&times;</button></div><div class="ef">'+f('rank','Rank',c.rank)+f('name','Name',c.name)+f('species','Species',c.species)+f('pron','Pronouns',c.pron||'')+f('role','Role / assignment',c.role,1)+f('player','Player (blank = NPC / GM)',c.player,1)+'</div><div class="sec">Attributes &amp; Departments (leave blank for none)</div><div class="esg">'+sg+'</div><div class="sec">Focuses (one per line)</div><textarea id="e-foc" rows="6">'+esc((c.foc||[]).filter(Boolean).join('\n'))+'</textarea><div><button type="button" class="btn o" data-sv="'+(id||'')+'">Save</button> <button type="button" class="btn s" data-x="1">Cancel</button></div>')}
function saveEdit(id){var v=function(k){return $('#e-'+k).value.trim()},nm=v('name');if(!nm){$('#e-name').focus();return}
 var c=id?byId(id):{id:uid()};if(!c)return;
 c.rank=v('rank');c.name=nm;c.species=v('species');c.pron=v('pron');c.role=v('role');c.player=v('player');
 c.stats=SL.map(function(l,i){return v('s'+i)});if(!c.stats.some(Boolean))c.stats=[];
 c.foc=$('#e-foc').value.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean).slice(0,12);
 if(!id)D.chars.push(c);save();render();closeM()}
function barTxt(){var b=!$('#t-bridge').hidden;$('#barlbl').textContent=b?BR().name+' // Duty Stations // Crew Assignment':'Campaign Roster // Personnel & NPC Index'}
function dropAll(id){D.bridges.forEach(function(b){for(var k in b.seats)if(b.seats[k].id===id)delete b.seats[k]})}
function delBridge(){var b=BR();if(b.builtin){alert('Built-in bridges cannot be deleted.');return}if(D.bridges.length<2){alert('At least one bridge must remain.');return}if(!confirm('Delete bridge "'+b.name+'" and its seating?'))return;D.bridges=D.bridges.filter(function(x){return x!==b});D.act=D.bridges[0].id;save();render()}
function copyEntry(){var b=BR(),L=lay(b.id)||{},LET=function(c){return c===R?'C':(c===B?'S':'O')},qt=function(x){return String(x).replace(/'/g,"\\'")};
 var t="{\n  id: '"+qt(b.id)+"',\n  name: '"+qt(b.name)+"',\n  img: '"+(L.img||'bridge/YOUR-IMAGE.png')+"',\n  line: '"+(L.line||'')+"',\n  st: [\n"+sts().map(function(q){return "    ["+q.n+", '"+qt(q.name)+"', '"+LET(q.c)+"', "+q.x+", "+q.y+"]"}).join(',\n')+"\n  ]\n},";
 modal('<div class="dh"><span>DEFAULT ENTRY</span><button type="button" data-x="1">&times;</button></div><div>Paste this into the list in bridge/layouts.js (instructions are at the top of that file).</div><textarea id="ent" rows="14" readonly>'+esc(t)+'</textarea><div><button type="button" class="btn o" data-copyent="1">Copy</button></div>')}
function drop(id){for(var n in BR().seats)if(BR().seats[n].id===id)delete BR().seats[n]}
document.addEventListener('click',function(e){var t=e.target,x;
 if(t.dataset.ov)return closeM();
 if(t.dataset.x)return closeM();
 if((x=t.closest('[data-f]')))F=x.dataset.f,render();
 else if(t.dataset.sv!==undefined)saveEdit(t.dataset.sv);
 else if(t.dataset.addnpc)edit(null);
 else if(t.dataset.ed)edit(t.dataset.ed);
 else if(t.dataset.rm){var c=byId(t.dataset.rm);if(c&&confirm('Remove '+lab(c)+' from the roster (and any station)?')){dropAll(c.id);D.chars=D.chars.filter(function(q){return q!==c});save();render()}}
 else if(t.dataset.clr){delete BR().seats[t.dataset.clr];save();render();closeM()}
 else if(t.dataset.pick){var n=+$('.dh span').textContent.split(' ')[0];drop(t.dataset.pick);BR().seats[n]={id:t.dataset.pick};save();render();closeM()}
 else if(t.dataset.lab||t.dataset.npc){var rk=$('#cr').value.trim(),nm=$('#cn').value.trim(),n2=+(t.dataset.lab||t.dataset.npc);if(!nm){$('#cn').focus();return}
  if(t.dataset.lab)BR().seats[n2]={text:[rk,nm].join(' ').trim()};else{var c2={id:uid(),rank:rk,name:nm,species:'',role:'',player:'',stats:[],foc:[]};D.chars.push(c2);BR().seats[n2]={id:c2.id}}
  save();render();closeM()}
 else if(t.dataset.bt){D.act=t.dataset.bt;save();render()}
 else if(t.dataset.cpy)copyEntry();
 else if(t.dataset.delbr)delBridge();
 else if(t.dataset.copyent){var ta=$('#ent');ta.select();try{if(navigator.clipboard)navigator.clipboard.writeText(ta.value);else document.execCommand('copy')}catch(x){}t.textContent='Copied'}
 else if(t.dataset.map){MAPC=!MAPC;try{localStorage.setItem('sta2e_roster_map',MAPC?'c':'l')}catch(x){}applyMap();render()}
 else if(t.dataset.edit){EDIT=!EDIT;render()}
 else if(t.dataset.addst)addStn();
 else if(t.dataset.delst){var dq=stn(+t.dataset.delst),dw=dq&&occ(dq.n);if(dq&&confirm('Delete station '+dq.n+' '+dq.name+'?'+(dw?'\n'+dw.t+' will be unseated.':''))){delete BR().seats[dq.n];BR().st=BR().st.filter(function(z){return z!==dq});save();render()}}
 else if(t.dataset.rst&&!lay(BR().id))alert('This bridge has no default layout to restore.');
 else if(t.dataset.rst)modal('<div class="dh"><span>RESET LAYOUT</span><button type="button" data-x="1">&times;</button></div><div>Restore the default stations and pin positions for this bridge. Stations you added (numbers not in the defaults) can be kept or removed. Seating is not changed.</div><button type="button" class="btn o" data-rstk="1">Restore, keep my added stations</button><button type="button" class="btn r" data-rstk="0">Restore, remove added stations</button>')
 else if(t.dataset.rstk){var keep=t.dataset.rstk==='1',df=defSt(lay(BR().id)),nums=df.map(function(q){return q.n}),extra=keep?BR().st.filter(function(q){return nums.indexOf(q.n)<0}):[];BR().st=df.concat(extra);Object.keys(BR().seats).forEach(function(k){if(!stn(+k))delete BR().seats[k]});save();render();closeM()}
 else if((x=t.closest('[data-stn]'))){if(!(EDIT&&x.classList.contains('pin')))seat(+x.dataset.stn)}
 else if((x=t.closest('[data-tab]'))){var b=x.dataset.tab==='bridge';$('#t-roster').hidden=b;$('#t-bridge').hidden=!b;$('#ttl').textContent=b?'Bridge Duty Stations':'Campaign Roster';if(b)bridge();barTxt();fitF();
  document.querySelectorAll('[data-tab]').forEach(function(q){q.className='btn '+(q===x?'on':'s')})}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.pl){var c=byId(t.dataset.pl);if(c){c.player=t.value.trim();save();render()}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
var dk;try{dk=localStorage.getItem('sta2e_dark_play')==='1'}catch(e){dk=false}
function th(){document.body.classList.toggle('dark',dk);$('#theme').textContent='Theme: '+(dk?'Dark':'Light')}
$('#theme').onclick=function(){dk=!dk;try{localStorage.setItem('sta2e_dark_play',dk?'1':'0')}catch(e){}th()};
$('#back').onclick=function(e){e.preventDefault();window.close();setTimeout(function(){location.href='index.html'},150)};
th();applyMap();render();
})();
</script>
